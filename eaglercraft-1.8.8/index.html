<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  #game_frame {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000;
  }
</style>

<script src="https://cdn.jsdelivr.net/gh/mece188/feh@main/classes.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mece188/feh@main/fix-webm-duration.js"></script>

<script>
  window.addEventListener('load', function () {
    window.focus();
    document.body.addEventListener('click', function () {
      window.focus();
    }, false);
  });

  window.addEventListener("load", () => {
    if (document.location.href.startsWith("file:")) {
      console.warn("HTTP required. Do not open this file locally.");
    } else {
      if (!window.eaglercraftXOpts) {
        window.eaglercraftXOpts = {
          container: "game_frame",
          assetsURI: "https://cdn.jsdelivr.net/gh/mece188/feh@main/assets.epk",
          localesURI: "lang/",
          servers: [
            { addr: "wss://mc.arch.lol/", name: "ArchMC" },
            { addr: "wss://mc.asspixel.net", name: "AssPixel" },
            { addr: "wss://sus.shhnowisnottheti.me", name: "Ayunboom" },
            { addr: "wss://aeon-network.net/1.8", name: "Aeon" },
            { addr: "wss://zentic.org/", name: "Zentic" }
          ]
        };
      }

      let container = document.querySelector("#" + window.eaglercraftXOpts.container);
      if (!container) {
        container = document.createElement("div");
        container.id = window.eaglercraftXOpts.container;
        document.body.appendChild(container);
      }

      try {
        main();
      } catch (e) {
        console.error("Error starting EaglercraftX:", e);
      }
    }
  });
</script>

<div id="game_frame" class="_eaglercraftX_root_element" style="overflow: hidden;">
  <div class="_eaglercraftX_wrapper_element" style="position: relative; width: 100%; height: 100%; overflow: hidden;">
    <canvas
      class="_eaglercraftX_canvas_element"
      style="width: 100%; height: 100%; image-rendering: pixelated;">
    </canvas>
    <div class="_eaglercraftX_keyboard_open_zone" style="display:none;"></div>
  </div>
</div>

<div id="_eaglercraftX_crashReason" style="display:none;"></div>
<div id="_eaglercraftX_crashUserAgent" style="display:none;"></div>
