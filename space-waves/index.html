<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Space Waves</title>
   </head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div id="preloader">
            <div id="preloader-top">
                <img id="thumbnail" alt="Game Logo" src="icon.png">
                <div id="preloader-top-container">
                    <div id="game-title">Loading...</div>
                    <div id="progress-container">
                        <div id="progress-bar">
                            <div id="progress-fill"></div>
                        </div>
                        <div id="progress-amount">0%</div>
                    </div>
                    <div id="progress-comment">Initializing...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <div id="game" style="width: 100%; height: 100%; position: relative; background: rgb(35, 31, 32);">
            <canvas id="canvas" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
    </div>

    <script src="/scripts/loaders/UnityLoader.js?v1"></script>
    
    <script>
        const GAME_CONFIG = {
            productName: "Space Waves",
            dataUrl: "Build/space-waves.data",
            frameworkUrl: "Build/space-waves.framework.js",
            codeUrl: "Build/space-waves.wasm",
            loaderUrl: "Build/space-waves.loader.js",
            
            productVersion: "1.0",
            companyName: "Arcadrome",
            icon: "icon.png"
        };

        (function loadGame() {
            document.getElementById("page-title").textContent = GAME_CONFIG.productName;
            GameLoader.init(GAME_CONFIG);
            const loaderScript = document.createElement("script");
            loaderScript.src = GAME_CONFIG.loaderUrl;
            
            loaderScript.onload = function() {
                createUnityInstance(
                    document.getElementById("canvas"),
                    GAME_CONFIG,
                    GameLoader.updateProgress
                )
                .then(function(unityInstance) {
                    window.gameInstance = unityInstance;
                    console.log("Game loaded successfully");
                })
                .catch(function(error) {
                    console.error("Failed to load game:", error);
                    if (GameLoader.ui.comment) {
                        GameLoader.ui.comment.textContent = "Failed to load game";
                    }
                });
            };
            
            loaderScript.onerror = function() {
                console.error("Failed to load loader script");
                if (GameLoader.ui.comment) {
                    GameLoader.ui.comment.textContent = "Failed to load game";
                }
            };
            
            document.body.appendChild(loaderScript);
        })();
    </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"746e692914cd4b90b5c7c71508c3d45b","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
